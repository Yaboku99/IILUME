<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria IILUME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
    <header class="phone-header">
        <!-- Botão voltar -->
        <button
                id="back_button"
                class="header-button"
                aria-label="Voltar">
            <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">
                <path
                        d="M15 18L9 12L15 6">
                </path>
            </svg>
        </button>

        <!-- Título -->
        <h1>
            Galeria IILUME
        </h1>

        <!-- Editar -->
        <button
                id="edit_button"
                class="edit-button">
            Editar
        </button>
    </header>

    <!-- FOTO PRINCIPAL -->
    <section class="main-photo">
        <img
                id="main_image"
                src="assets/images/gallery/foto1.jpg"
                alt="Foto selecionada">
    </section>

    <!-- MINIATURAS-->
    <section
            id="thumbnail_container"
            class="thumbnails">
    </section>

    <nav class="bottom-actions">
        <!-- COMPARTILHAR -->
        <button
                id="share_button"
                class="action-button"
                aria-label="Compartilhar">

            <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8">
                <path
                        d="M12 16V4">
                </path>
                <path
                        d="M7 9L12 4L17 9">
                </path>
                <path
                        d="M5 14V19C5 20.1 5.9 21 7 21H17C18.1 21 19 20.1 19 19V14">
                </path>
            </svg>
        </button>

        <!-- FAVORITO -->
        <button
                id="favorite_button"
                class="action-button"
                aria-label="Favoritar">
            <svg
                    id="heart_icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8">
                <path
                        d="M20.8 8.8C20.8 13.5 12 19 12 19S3.2 13.5 3.2 8.8C3.2 6.1 5.2 4 7.8 4C9.4 4 10.8 4.8 12 6.1C13.2 4.8 14.6 4 16.2 4C18.8 4 20.8 6.1 20.8 8.8Z">
                </path>
            </svg>
        </button>

        <!-- INFORMAÇÕES -->
        <button
                id="info_button"
                class="action-button"
                aria-label="Informações">
            <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8">
                <circle
                        cx="12"
                        cy="12"
                        r="9">
                </circle>
                <path
                        d="M12 10V16">
                </path>
                <circle
                        cx="12"
                        cy="7"
                        r="0.8"
                        fill="currentColor">
                </circle>
            </svg>
        </button>


        <!-- EXCLUIR -->
        <button
                id="delete_button"
                class="action-button"
                aria-label="Excluir">
            <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8">
                <path
                        d="M4 7H20">
                </path>
                <path
                        d="M9 7V4H15V7">
                </path>
                <path
                        d="M7 7L8 20H16L17 7">
                </path>
            </svg>
        </button>
    </nav>

    <!-- BARRA INFERIOR DO CELULAR-->
    <div class="home-indicator"></div>

    <!-- INFORMAÇÕES DA FOTO-->
    <div
            id="photo_info"
            class="photo-info hidden">
        <h2>
            Informações
        </h2>
        <p id="photo_name">
            foto1.jpg
        </p>
        <p>
            Imagem processada pelo IILUME
        </p>
    </div>

</div>

<!-- JavaScript -->
<script src="js/script.js"></script>
</body>
</html>
