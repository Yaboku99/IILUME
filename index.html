<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IILUME Camera Component</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white cam-unselectable d-flex align-items-center justify-content-center min-vh-100">

  <!-- Container Principal do Celular -->
  <main class="cam-container position-relative overflow-hidden d-flex flex-column justify-content-between">
    
    <!-- Status Bar Mobile -->
    <div class="cam-status-bar d-flex justify-content-between align-items-center px-4 pt-2">
      <span class="fw-bold fs-6">9:41</span>
      <div class="cam-dynamic-island rounded-pill bg-black"></div>
      <div class="d-flex align-items-center gap-2 fs-6">
        <i class="bi bi-reception-4"></i>
        <i class="bi bi-wifi"></i>
        <i class="bi bi-battery-full"></i>
      </div>
    </div>

    <!-- Top Bar: Controles Rápidos e Indicador de Câmera -->
    <header class="cam-top-bar d-flex justify-content-between align-items-center px-4 py-2">
      <button id="cam-btn-flash" class="btn text-white p-0 rounded-circle border-0 cam-icon-circle" title="Flash">
        <i class="bi bi-zap" id="cam-icon-flash"></i>
      </button>
      
      <!-- Indicador Visual (Frontal / Traseira) -->
      <div class="cam-indicator-badge d-flex align-items-center gap-1 rounded-pill px-2 py-1">
        <i class="bi bi-camera-fill text-info fs-6" id="cam-icon-type"></i>
        <span id="cam-text-type" class="fw-bold tracking-wide">TRASEIRA</span>
      </div>

      <button id="cam-btn-grid" class="btn text-white p-0 rounded-circle border-0 cam-icon-circle" title="Grade">
        <i class="bi bi-bullseye fs-5"></i>
      </button>
    </header>

    <!-- Área Principal da Câmera (Viewfinder) -->
    <section class="cam-viewfinder position-relative flex-grow-1 overflow-hidden">
      <!-- Media Stream -->
      <video id="cam-stream" autoplay playsinline muted class="cam-media cam-zoom-26mm"></video>

      <!-- Ícone de Flash do Disparador -->
      <div id="cam-shutter-icon-flash" class="cam-shutter-icon-flash d-none position-absolute top-50 start-50 translate-middle text-center">
        <i class="bi bi-zap-fill text-warning display-1"></i>
      </div>
      
      <!-- Grade de Terços -->
      <div id="cam-grid" class="cam-grid d-none">
        <div class="cam-grid-line cam-horizontal" style="top: 33.33%;"></div>
        <div class="cam-grid-line cam-horizontal" style="top: 66.66%;"></div>
        <div class="cam-grid-line cam-vertical" style="left: 33.33%;"></div>
        <div class="cam-grid-line cam-vertical" style="left: 66.66%;"></div>
      </div>

      <!-- Overlays de Flash -->
      <div id="cam-shutter-flash" class="cam-shutter-flash"></div>
      <div id="cam-flash-overlay" class="cam-flash-overlay"></div>

      <!-- Bolotinha de Zoom Minimizada -->
      <button id="cam-zoom-trigger" class="cam-zoom-trigger position-absolute bottom-0 start-50 translate-middle-x mb-3 rounded-circle border-0 text-info fw-bold shadow">
        <span id="cam-zoom-trigger-text">1x</span>
      </button>

      <!-- Dial de Zoom Expansível -->
      <div class="cam-dial-container cam-dial-hidden position-absolute bottom-0 start-50 translate-middle-x" id="cam-dial">
        <button id="cam-zoom-close" class="cam-zoom-close rounded-circle border-0 text-white">&times;</button>
        <svg class="cam-dial-svg" viewBox="0 0 400 200">
          <defs>
            <radialGradient id="camBlueGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00aaff" stop-opacity="0.8" />
              <stop offset="40%" stop-color="#0033aa" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#050a1a" stop-opacity="0.9" />
            </radialGradient>
          </defs>
          <path d="M 20,200 A 180,180 0 0,1 380,200 Z" fill="url(#camBlueGlow)" />
          <line x1="200" y1="15" x2="200" y2="35" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
          <g id="cam-dial-ticks" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"></g>
        </svg>

        <!-- Lentes Interativas no Dial -->
        <div class="cam-dial-content" id="cam-dial-content">
          <div class="cam-lens-item cam-lens-13mm" data-lens="13mm" data-angle="-30">
            <span class="d-block fs-6">0,5</span>
            <span class="d-block small">13 MM</span>
          </div>

          <div class="cam-lens-item cam-lens-26mm active" data-lens="26mm" data-angle="0">
            <span class="d-block fs-6">1</span>
            <span class="d-block small">26 MM</span>
          </div>

          <div class="cam-lens-item cam-lens-77mm" data-lens="77mm" data-angle="30">
            <span class="d-block fs-6">3</span>
            <span class="d-block small">77 MM</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Controles Inferiores -->
    <footer class="cam-bottom-bar bg-black pt-2 pb-4 d-flex flex-column align-items-center">
      <div class="d-flex align-items-center justify-content-between w-100 px-5 my-2">
        <!-- Espaço reservado para a Galeria -->
        <div class="cam-thumb-placeholder border border-secondary rounded-circle overflow-hidden">
          <img id="cam-thumb-img" class="w-100 h-100 object-fit-cover d-none" alt="Thumb">
        </div>

        <!-- Botão Disparador -->
        <button id="cam-btn-shutter" class="cam-shutter-ring rounded-circle d-flex align-items-center justify-content-center border-0 p-0">
          <div class="cam-shutter-core rounded-circle"></div>
        </button>

        <!-- Botão Inverter Câmera -->
        <button id="cam-btn-flip" class="cam-flip-btn rounded-circle d-flex align-items-center justify-content-center border-0 text-white">
          <i class="bi bi-arrow-repeat fs-5"></i>
        </button>
      </div>

      <div class="cam-home-indicator rounded-pill bg-white mt-2 opacity-50"></div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
