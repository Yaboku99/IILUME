<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IILUME — Modo IA</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --bg-deep:#05060f;
    --neon-blue:#3ec6ff;
    --neon-purple:#8b5cf6;
    --neon-pink:#c084fc;
    --text-dim:#9aa3c2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg-deep);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:linear-gradient(180deg,#070915 0%,#05060f 100%);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* Header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    z-index:6;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;transition:.15s;
  }
  .icon-btn.active{background:rgba(62,198,255,.28);border-color:var(--neon-blue);color:var(--neon-blue);}
  .icon-btn:hover{background:rgba(255,255,255,.12);}
  .topbar h6{margin:0;font-weight:600;letter-spacing:.3px;}
  .topbar-actions{display:flex;gap:8px;}

  /* Viewport */
  .viewport{
    position:relative;
    flex:1;
    margin:0 14px;
    border-radius:22px;
    overflow:hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(62,198,255,.25), transparent 55%),
      radial-gradient(circle at 75% 70%, rgba(139,92,246,.3), transparent 55%),
      #050611;
    min-height:52vh;
  }
  .test-photo{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    filter:brightness(.7) contrast(.95) saturate(.85);
    transition:filter .4s ease;
  }

  /* Grid de composição */
  .grid-overlay{
    position:absolute;inset:0;
    display:none;
    pointer-events:none;
    z-index:3;
    background-image:
      linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.32) 33.2%, rgba(255,255,255,.32) 33.5%, transparent 33.5%, transparent 66.2%, rgba(255,255,255,.32) 66.2%, rgba(255,255,255,.32) 66.5%, transparent 66.5%),
      linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.32) 33.2%, rgba(255,255,255,.32) 33.5%, transparent 33.5%, transparent 66.2%, rgba(255,255,255,.32) 66.2%, rgba(255,255,255,.32) 66.5%, transparent 66.5%);
  }
  .grid-overlay.show{display:block;}

  /* Leitura tipo câmera profissional */
  .cam-readout{
    position:absolute;
    bottom:10px;left:12px;
    display:flex;flex-direction:column;gap:2px;
    font-family:'Courier New', monospace;
    font-size:.62rem;
    color:rgba(255,255,255,.55);
    letter-spacing:.3px;
    z-index:2;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }

  .analyzing-overlay{
    position:absolute;inset:0;
    background:rgba(3,4,10,.78);
    backdrop-filter:blur(3px);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    z-index:5;
  }
  .analyzing-overlay.show{display:flex;}
  .scan-line{
    position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--neon-blue),transparent);
    box-shadow:0 0 14px var(--neon-blue);
    animation:scan 1.3s ease-in-out infinite;
  }
  @keyframes scan{0%{top:8%;}50%{top:88%;}100%{top:8%;}}
  .spinner-ring{
    width:48px;height:48px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--neon-blue);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .analyzing-text{font-size:.92rem;color:#cfe8ff;letter-spacing:.3px;min-height:1.3em;transition:opacity .2s;}
  .analyzing-bar{
    width:180px;height:4px;border-radius:4px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
  }
  .analyzing-bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--neon-blue),var(--neon-purple));
    border-radius:4px;
    transition:width .25s linear;
  }

  /* Before/After */
  .compare-wrap{position:absolute;inset:0;display:none;z-index:4;}
  .compare-wrap.show{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .compare-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .compare-after{transition:filter .25s ease;}
  .compare-before{
    filter:brightness(.7) contrast(.95) saturate(.85);
    clip-path: inset(0 50% 0 0);
  }
  .compare-handle{
    position:absolute;top:0;bottom:0;left:50%;
    width:2px;background:#fff;
    box-shadow:0 0 10px #fff;
    cursor:ew-resize;
  }
  .compare-handle::after{
    content:'⇔';
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:32px;height:32px;border-radius:50%;
    background:#fff;color:#111;
    display:flex;align-items:center;justify-content:center;
    font-size:.9rem;
  }
  .tag{position:absolute;top:14px;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.5px;z-index:2;}
  .tag-sub{display:block;font-weight:400;font-size:.58rem;opacity:.75;letter-spacing:.2px;margin-top:1px;font-family:'Courier New',monospace;}
  .tag-antes{left:14px;background:rgba(0,0,0,.6);}
  .tag-depois{right:14px;background:var(--neon-blue);color:#00202e;}
  .tag-depois .tag-sub{color:#00202e;opacity:.7;}

  /* Control panel */
  .control-panel{padding:14px 20px 22px;position:relative;z-index:5;}

  .preset-row{
    display:flex;gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:8px;
    scrollbar-width:none;
  }
  .preset-row::-webkit-scrollbar{display:none;}
  .preset-chip{
    flex:0 0 auto;
    padding:6px 14px;
    border-radius:20px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    font-size:.72rem;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:.15s;
    white-space:nowrap;
  }
  .preset-chip .dot{width:8px;height:8px;border-radius:50%;}
  .preset-chip.active{
    background:rgba(62,198,255,.18);
    border-color:var(--neon-blue);
    color:#fff;
  }

  .intensity-label{text-align:center;font-size:.75rem;color:var(--text-dim);margin-bottom:6px;}
  #intensityValue{color:var(--neon-blue);font-weight:700;}

  .arc-wrap{position:relative;height:56px;margin:0 auto 6px;max-width:340px;}
  input[type=range].arc-slider{-webkit-appearance:none;width:100%;height:56px;background:transparent;position:relative;z-index:2;}
  .arc-track{position:absolute;top:27px;left:0;right:0;height:2px;background:linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.25), rgba(255,255,255,.06));border-radius:2px;}
  input[type=range].arc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:22px;background:var(--neon-blue);box-shadow:0 0 8px var(--neon-blue);border-radius:2px;margin-top:17px;cursor:pointer;}
  input[type=range].arc-slider::-moz-range-thumb{width:4px;height:22px;background:var(--neon-blue);box-shadow:0 0 8px var(--neon-blue);border:none;border-radius:2px;}

  .ai-btn-row{display:flex;align-items:center;justify-content:center;gap:40px;margin-top:4px;margin-bottom:14px;}
  .close-btn, .confirm-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:.15s;}
  .close-btn:active, .confirm-btn:active{transform:scale(.9);}
  .confirm-btn{color:var(--neon-blue);}
  .ai-main-btn{
    position:relative;
    width:68px;height:68px;border-radius:50%;border:none;
    background:radial-gradient(circle at 35% 30%, #7ee8ff, var(--neon-blue) 55%, #1a6fa8 100%);
    box-shadow:0 0 22px rgba(62,198,255,.7), inset 0 0 10px rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;
    color:#04141f;font-weight:800;font-size:.85rem;letter-spacing:.5px;
    cursor:pointer;transition:transform .15s;
  }
  .ai-main-btn:active{transform:scale(.93);}
  .ai-main-btn.busy{opacity:.5;pointer-events:none;}
  .ai-main-btn .ring{
    position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--neon-blue);
    opacity:0;
  }
  .ai-main-btn.pulse .ring{animation:pulseRing .5s ease-out;}
  @keyframes pulseRing{
    0%{opacity:.9;transform:scale(.8);}
    100%{opacity:0;transform:scale(1.5);}
  }

  .toast-msg{
    position:absolute;bottom:150px;left:50%;transform:translateX(-50%);
    background:rgba(20,22,40,.92);border:1px solid rgba(62,198,255,.4);
    padding:8px 16px;border-radius:20px;font-size:.75rem;
    opacity:0;transition:opacity .3s;z-index:7;white-space:nowrap;
    display:flex;align-items:center;gap:6px;
  }
  .toast-msg.show{opacity:1;}

  /* Histórico de salvos */
  .saved-strip-label{font-size:.68rem;color:var(--text-dim);margin-bottom:8px;display:none;}
  .saved-strip-label.show{display:block;}
  .saved-strip{display:flex;gap:8px;}
  .saved-thumb{
    width:46px;height:46px;border-radius:10px;
    object-fit:cover;
    border:1px solid rgba(62,198,255,.4);
    box-shadow:0 4px 10px rgba(0,0,0,.4);
    animation:thumbIn .3s ease;
  }
  @keyframes thumbIn{from{opacity:0;transform:translateY(8px) scale(.8);}to{opacity:1;transform:translateY(0) scale(1);}}
</style>
</head>

  const camReadout = document.getElementById('camReadout');

  function haptic(ms){ if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} } }

  function buildFilter(presetKey, t){
    const p = PRESETS[presetKey];
    const b = 1 + (p.brightness - 1) * t;
    const c = 1 + (p.contrast - 1) * t;
    const s = 1 + (p.saturate - 1) * t;
    const h = p.hue * t;
    const sep = p.sepia * t;
    return `brightness(${b.toFixed(2)}) contrast(${c.toFixed(2)}) saturate(${s.toFixed(2)}) hue-rotate(${h.toFixed(1)}deg) sepia(${sep.toFixed(2)})`;
  }

  function applyIntensity(){
    const t = slider.value / 100;
    afterPhoto.style.filter = buildFilter(currentPreset, t);
    // "melhora" as leituras de ISO/velocidade proporcionalmente à intensidade
    const iso = Math.round(1600 - (1600 - 100) * t);
    const shutter = Math.round(15 + (250 - 15) * t);
    depoisSub.textContent = `ISO ${iso} · 1/${shutter}s`;
  }

  slider.addEventListener('input', () => {
    valueLabel.textContent = slider.value;
    applyIntensity();
  });

  document.querySelectorAll('.preset-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentPreset = chip.dataset.preset;
      applyIntensity();
      haptic(10);
    });
  });

  gridBtn.addEventListener('click', () => {
    gridBtn.classList.toggle('active');
    gridOverlay.classList.toggle('show');
    haptic(10);
  });

  // Simula a análise de IA em etapas, com barra de progresso
  const PHASES = [
    'Detectando cenário...',
    'Corrigindo exposição...',
    'Reduzindo ruído...',
    'Aumentando nitidez...',
    'Aplicando estilo ' + PRESETS[currentPreset].label + '...',
    'Finalizando...'
  ];

  aiBtn.addEventListener('click', () => {
    if (aiBtn.classList.contains('busy')) return;
    haptic(15);
    aiBtn.classList.add('busy', 'pulse');
    setTimeout(() => aiBtn.classList.remove('pulse'), 500);
    compareWrap.classList.remove('show');
    analyzingOverlay.classList.add('show');

    const phases = [
      'Detectando cenário...',
      'Corrigindo exposição...',
      'Reduzindo ruído...',
      'Aumentando nitidez...',
      `Aplicando estilo ${PRESETS[currentPreset].label}...`,
      'Finalizando...'
    ];
    let step = 0;
    analyzingText.textContent = phases[0];
    analyzingBarFill.style.width = '0%';

    const stepMs = 380;
    const interval = setInterval(() => {
      step++;
      analyzingBarFill.style.width = Math.min(100, (step / phases.length) * 100) + '%';
      if (step < phases.length) {
        analyzingText.style.opacity = 0;
        setTimeout(() => { analyzingText.textContent = phases[step]; analyzingText.style.opacity = 1; }, 120);
      } else {
        clearInterval(interval);
      }
    }, stepMs);

    setTimeout(() => {
      analyzingOverlay.classList.remove('show');
      compareWrap.classList.add('show');
      aiBtn.classList.remove('busy');
      applyIntensity();
      showToast(`Estilo ${PRESETS[currentPreset].label} aplicado`, '✨');
      haptic(20);
    }, phases.length * stepMs + 250);
  });

  function showToast(msg, icon){
    toast.innerHTML = (icon ? `<span>${icon}</span>` : '') + `<span>${msg}</span>`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }

  cancelBtn.addEventListener('click', () => {
    compareWrap.classList.remove('show');
    haptic(10);
  });

  let savedCount = 0;
  confirmBtn.addEventListener('click', () => {
    if (!compareWrap.classList.contains('show')) {
      showToast('Aplique a IA antes de salvar', '⚠️');
      return;
    }
    savedCount++;
    const thumb = document.createElement('img');
    thumb.className = 'saved-thumb';
    thumb.src = testPhotoSrc;
    thumb.style.filter = afterPhoto.style.filter;
    savedStrip.prepend(thumb);
    while (savedStrip.children.length > 4) savedStrip.removeChild(savedStrip.lastChild);
    savedLabel.classList.add('show');
    showToast('Foto salva em "Salvos pela IA"', '✅');
    haptic(25);
  });

  // Arrasto do comparador antes/depois
  let dragging = false;
  const viewport = document.getElementById('viewport');

  function moveHandle(clientX){
    const rect = viewport.getBoundingClientRect();
    let pct = ((clientX - rect.left) / rect.width) * 100;
    pct = Math.max(0, Math.min(100, pct));
    compareHandle.style.left = pct + '%';
    compareBefore.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
  }

  compareHandle.addEventListener('mousedown', () => dragging = true);
  compareHandle.addEventListener('touchstart', () => dragging = true, {passive:true});
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('touchend', () => dragging = false);
  window.addEventListener('mousemove', e => { if(dragging) moveHandle(e.clientX); });
  window.addEventListener('touchmove', e => { if(dragging) moveHandle(e.touches[0].clientX); }, {passive:true});

  applyIntensity();
</script>
</body>
</html>
